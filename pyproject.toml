[project]
name = "gomoku-assistant"
version = "0.1.0"
description = "五子棋盯屏助手：采集 → 标定 → 解析 → 状态同步 → 决策 → 终端建议 + 异步讲解"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gomoku"]
